const story=`<div class="story"><p>En enero de 2026, la participación del equipo en la liga estuvo en serio riesgo debido a un saldo pendiente de L 20,000.00 heredado de la temporada 2025. La junta directiva de la competición fue clara: la inscripción para el torneo 2026 dependía exclusivamente de saldar dicha deuda antes del inicio fijado para febrero.</p><p>Ante este desafío, el plantel se convocó en asamblea en el salón «Jorge Bueso Arias» del noveno piso de la Secretaría de Finanzas. Con la determinación de no dejar morir la representación institucional, los jugadores eligieron a una nueva junta directiva encomendándole la misión inmediata de rescatar al equipo y negociar un acuerdo sostenible con las autoridades de la liga.</p><p>Fue así como se conformó un equipo directivo comprometido, liderado por Ernesto Flores como Presidente y Marco Castro en la Secretaría, quienes asumieron la representación ejecutiva y la visión del proyecto. Para estructurar la estrategia financiera y garantizar el manejo transparente de cada lempira, Leman Romero tomó las riendas de la Tesorería. En el frente diplomático ante la liga, la determinación y capacidad de negociación de Ariel Ramírez (Delegado) y Edwin Fernando Melara con Breth Carías (Delegados Suplentes) resultaron fundamentales para alcanzar un acuerdo favorable de cuotas semanales y abonos extraordinarios. Asimismo, en el ámbito deportivo y de cohesión del grupo, Marlon Salgado y Darwin Martínez asumieron la Dirección Técnica, manteniendo al equipo unido y enfocado en la cancha a pesar de las adversidades.</p><p>El punto de partida fue exigente: una deuda de L 20,000.00 frente a un saldo inicial en caja de apenas L 2,000.00. Sin embargo, gracias al liderazgo de esta directiva y al respaldo incondicional de jugadores, aficionados y colaboradores, el compromiso se cumplió en su totalidad. Se sanearon las finanzas a tiempo, se evitó una salida deshonrosa de la competición y se restauró por completo el prestigio y la dignidad de nuestro equipo ante la liga.</p></div>`;
function numberValue(value){
  if(typeof value==="number")return Number.isFinite(value)?value:0;
  let text=String(value??"").trim().replace(/[^\d,.-]/g,"");
  if(!text)return 0;
  const comma=text.lastIndexOf(","),dot=text.lastIndexOf(".");
  if(comma>-1&&dot>-1){
    if(dot>comma)text=text.replace(/,/g,"");
    else text=text.replace(/\./g,"").replace(",",".");
  }else if(comma>-1){
    const decimals=text.length-comma-1;
    text=decimals===2?text.replace(",","."):text.replace(/,/g,"");
  }
  const valueNumber=Number(text);
  return Number.isFinite(valueNumber)?valueNumber:0;
}
function moneyHNL(value){return new Intl.NumberFormat("es-HN",{style:"currency",currency:"HNL",minimumFractionDigits:2}).format(value).replace("HNL","L").trim()}
function totalRows(rows,column){return rows.reduce((sum,row)=>sum+numberValue(row[column]),0)}
function escapeAttr(value){return String(value??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function cellContent(key,header,value){
  if(key==="egresos"&&header==="RECIBO/FACT NO."){
    const receipt=String(value??"").trim();
    if(!receipt)return"";

  }
  return value??"";
}

}
function chartRows(key,label,value,top,rows){
  const source=rows||D[key]?.rows||[],grouped={};
  source.forEach(row=>{const name=String(row[label]||"Sin identificar").trim()||"Sin identificar";grouped[name]=(grouped[name]||0)+numberValue(row[value])});
  const items=Object.entries(grouped).sort((a,b)=>b[1]-a[1]).slice(0,top),max=Math.max(...items.map(x=>x[1]),1);
  if(!items.length)return`<div class="empty">No hay registros disponibles para el gráfico.</div>`;
  return`<div class="bars">${items.map(([name,amount])=>`<div><span title="${name}">${name}</span><span><i style="width:${Math.max(4,amount/max*100)}%"></i><b>${moneyHNL(amount)}</b></span></div>`).join("")}</div>`
}
function barChart(key,label,value,top,titleText){return`<div class="panel"><h3>${titleText}</h3><div id="chart-${key}">${chartRows(key,label,value,top)}</div></div>`}
function pieChartRows(rows){
  const source=rows||D.egresos?.rows||[],grouped={};
  source.forEach(row=>{
    const name=String(row["PAGADO A"]||"Sin identificar").trim()||"Sin identificar";
    grouped[name]=(grouped[name]||0)+numberValue(row["MONTO"]);
  });
  const items=Object.entries(grouped).filter(([,amount])=>amount>0).sort((a,b)=>b[1]-a[1]);
  const total=items.reduce((sum,[,amount])=>sum+amount,0);
  if(!items.length||total<=0)return`<div class="empty">No hay montos disponibles para el gráfico.</div>`;
  const colors=["#062b55","#c62232","#f2bd23","#0a477f","#667482","#111820","#8f1825","#b58a0d"];
  let accumulated=0;
  const segments=items.map(([,amount],index)=>{
    const start=accumulated;
    accumulated+=amount/total*100;
    return`${colors[index%colors.length]} ${start.toFixed(2)}% ${accumulated.toFixed(2)}%`;
  }).join(",");
  const legend=items.map(([name,amount],index)=>{
    const percent=amount/total*100;
    return`<div><i style="background:${colors[index%colors.length]}"></i><span title="${name}">${name}</span><b>${percent.toFixed(1)}%<small>${moneyHNL(amount)}</small></b></div>`;
  }).join("");
  return`<div class="pie-layout"><div class="pie-chart" style="background:conic-gradient(${segments})" role="img" aria-label="Distribución porcentual de gastos por pagado a"><div class="pie-center"><small>Total</small><b>${moneyHNL(total)}</b></div></div><div class="pie-legend">${legend}</div></div>`;
}

n!4v1783382747776!5m2!1ses-419!2shn" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><h2 class="section-title">Preguntas Frecuentes</h2>${["¿Qué información contiene el portal?","¿De dónde provienen los datos?","¿Cómo se consultan las aportaciones?","¿Dónde se visualizan los comprobantes?","¿Qué representa el flujo de caja?","¿Cómo solicitar una aclaración?"].map(q=>`<details><summary>${q}</summary><p>Consulte las vistas financieras del menú o contacte a la Tesorería mediante WhatsApp para una aclaración.</p></details>`).join("")}</section>
<section id="historia" class="screen">${title("Nuestra historia","Un equipo rescatado con liderazgo y compromiso")}${story}<div class="gallery">${img("SaldoInicialCaja.jpeg","Lista de los aportantes del saldo inicial de caja")}${img("539.jpeg","Recibo en el cual la liga evidencia el saldo de la deuda")}</div></section>
<section id="aportaciones" class="screen">${title("Ingresos","Ingreso por Aportaciones","Aportes de jugadores, colaboradores y afición.")}<div class="split">${table("aportaciones","APORTANTE","CANTIDAD")}${barChart("aportaciones","APORTANTE","CANTIDAD",6,"Top 6 de aportantes")}</div></section>
<section id="actividades" class="screen">${title("Ingresos","Ingreso por Actividades Comerciales","Rifa móvil smartphone Samsumg Galaxy A26, rifarse con el número de la diaria del 25 de marzo del 2026 a las 9 pm.")}<div class="split">${table("actividades","PARTICIPANTE","CANTIDAD")}${barChart("actividades","PARTICIPANTE","CANTIDAD",3,"Top 3 de participantes")}</div></section>
<section id="egresos" class="screen">${title("Egresos","Compromisos y operación del equipo")}<div class="split">${table("egresos","PAGADO A","MONTO")}${pieChart()}</div></section>
<section id="flujo" class="screen">${title("Posición financiera","Resumen Flujo de Caja y Cuentas por Pagar")}<div class="insights"><article><b>L 0.81</b><p>Por cada Lempira recaudado se destinó L 0.81 a la deuda de la temporada 2025 y la admisión de la temporada 2026.</p></article><article><b>L 0.19</b><p>Por cada Lempira recaudado se utilizó L 0.19 para la operación del equipo en la temporada.</p></article><article><b>100%</b><p>La distribución informada asigna la totalidad de cada Lempira recaudado entre saneamiento y admisión (81%) y operación (19%).</p></article></div><h2>Flujo de Caja</h2>${table("flujo")}<h2>Cuentas por Pagar</h2>${table("cxp")}<div class="gallery">${img("000-001-01-00000188.jpeg","Factura emitida por la liga en razón de la admisión a la temporada 2026")}</div></section>

<section id="evidencias" class="screen">${title("Trazabilidad documental","EVIDENCIA DE ACTIVIDADES")}<div class="gallery">${evidence.map(x=>img(...x)).join("")}</div></section>`}
function nav(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.id===id));document.getElementById("nav").classList.remove("open");scrollTo({top:0,behavior:"smooth"})}
function render(){document.getElementById("app").innerHTML=screens();P.forEach(([id,name])=>{let b=document.createElement("button");b.textContent=name;b.dataset.id=id;b.onclick=()=>nav(id);document.getElementById("nav").appendChild(b)});nav("inicio")}
let receiptTimer=null;
function openImg(src,title){
  cancelReceipt();
  modalImg.src=src;
  modalImg.alt=title||"Imagen ampliada";
  modalText.textContent=title||"";
  modal.classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){cancelReceipt();modal.classList.remove("open");document.body.style.overflow="";modalImg.removeAttribute("src")}
function receiptImagePath(receipt){const clean=String(receipt||"").trim().replace(/[\\/]/g,"");return`imagenes/${/\.jpe?g$/i.test(clean)?clean:clean+".jpeg"}`}
function openReceipt(button){const receipt=button.dataset.receipt||"";openImg(receiptImagePath(receipt),`Recibo/Factura No. ${receipt}`)}
function scheduleReceipt(button){cancelReceipt();receiptTimer=setTimeout(()=>openReceipt(button),650)}
function cancelReceipt(){if(receiptTimer){clearTimeout(receiptTimer);receiptTimer=null}}
window.openImg=openImg;window.closeModal=closeModal;window.openReceipt=openReceipt;window.scheduleReceipt=scheduleReceipt;window.cancelReceipt=cancelReceipt;
modal.onclick=closeModal;
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&modal.classList.contains("open"))closeModal()});
function filterRows(el,key){
  const query=el.value.trim().toLowerCase(),d=D[key];
  const filterColumn=key==="aportaciones"?"APORTANTE":key==="actividades"?"PARTICIPANTE":"PAGADO A";
  const totalColumn=key==="egresos"?"MONTO":"CANTIDAD";
  const filtered=d.rows.filter(row=>String(row[filterColumn]??"").toLowerCase().includes(query));
  document.querySelectorAll(`#t-${key} tbody tr`).forEach((tr,index)=>tr.style.display=String(d.rows[index][filterColumn]??"").toLowerCase().includes(query)?"":"none");
  const totalElement=document.getElementById(`total-${key}`);
  if(totalElement)totalElement.textContent=moneyHNL(totalRows(filtered,totalColumn));
  const chart=document.getElementById(`chart-${key}`);
  if(chart){
    if(key==="egresos")chart.innerHTML=pieChartRows(filtered);
    else{
      const top=key==="aportaciones"?6:3;
      chart.innerHTML=chartRows(key,filterColumn,"CANTIDAD",top,filtered);
    }
  }
}
window.filterRows=filterRows;
menu.onclick=()=>navEl.classList.toggle("open");const navEl=document.getElementById("nav");chatBtn.onclick=()=>chat.classList.toggle("open");min.onclick=()=>chat.classList.remove("open");
const welcome=()=>msgs.innerHTML='<div class="msg ai">Bienvenido. Soy el Asistente IA del Portal Financiero EVF SEFIN 2026.</div><div class="chips">'+["¿Cuánto se ha recaudado?","¿Qué porcentaje se destinó para pago de la deuda?","¿Qué porcentaje se utilizó para la operatividad?","¿El gasto fue financiado por SEFIN?"].map(x=>`<button onclick="ask(${JSON.stringify(x)})">${x}</button>`).join("")+"</div>";welcome();clear.onclick=welcome;
function answer(s){s=s.toLowerCase();if(s.includes("actualiza")||s.includes("export")||s.includes("excel"))return"La actualización de los datos y su exportación a otros formatos es de carácter confidencial y reservado. Te recomendamos contactar a la fuente por WhatsApp.";if(s.includes("deuda"))return"El 81% se destinó conjuntamente a la deuda 2025 y la admisión 2026; no se informó el desglose individual.";if(s.includes("operativ"))return"El 19% de cada Lempira recaudado se utilizó para la operación del equipo.";if(s.includes("sefin")||s.includes("financiad"))return"La información disponible no establece que el gasto haya sido financiado por SEFIN.";if(s.includes("recaud"))return"El monto se consulta en las vistas de ingresos. Si aparece N/D, configure la conexión del Apps Script.";return"No encuentro ese dato específico en la información publicada. Revisa las vistas financieras o solicita una aclaración por WhatsApp."}
function ask(s){msgs.innerHTML+=`<div class="msg me">${s}</div><div class="msg ai">Escribiendo…</div>`;setTimeout(()=>{msgs.lastElementChild.textContent=answer(s);msgs.scrollTop=msgs.scrollHeight},500)}window.ask=ask;chatForm.onsubmit=e=>{e.preventDefault();if(q.value.trim()){ask(q.value);q.value=""}};
const waText=`⚽ ¡Bienvenidos al Portal de Transparencia! 📊\nEstimados jugadores, aficionados y colaboradores del equipo de fútbol de veteranos de la Secretaría de Finanzas:\nLes damos la más cordial bienvenida a este espacio digital, diseñado para ofrecerles información financiera clara, accesible y 100% confiable. 🤝\nA través de los 8 apartados del menú podrán consultar de forma detallada:\n• 📥 Ingresos: Aportaciones y actividades comerciales.\n• 📤 Egresos y Gestión: Resumen del flujo de caja y libro mayor de cuentas por pagar.\n• 🧾 Respaldos: Evidencias de cotizaciones, actividades y comprobantes de cada gasto realizado.\n• 📈 Historial: El estado financiero con el que recibimos la temporada.\n¡Los invitamos a explorarlo y ser parte activa de la transparencia de nuestro equipo! ⚽💪`;wa.href="https://wa.me/50498236915?text="+encodeURIComponent(waText);
render();if(WEB_APP_URL.startsWith("http")){fetch(WEB_APP_URL+"?action=visit").then(r=>r.json()).then(x=>visits.textContent=x.visitas??"N/D");Promise.all([["aportaciones","INGRESOS-FAP"],["actividades","INGRESOS-FAC"],["egresos","EGRESOS"],["flujo","FLUJO DE CAJA"],["cxp","CUENTAS POR PAGAR"]].map(async x=>[x[0],await fetch(WEB_APP_URL+"?action=data&sheet="+encodeURIComponent(x[1])).then(r=>r.json())])).then(x=>{x.forEach(([k,v])=>D[k]=v);document.getElementById("app").innerHTML="";document.getElementById("nav").innerHTML="";render()})}
